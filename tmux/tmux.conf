# set mouse scrolling
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# Shift Alt vim keys to switch windows
# shift + alt + h to go to the previous window
# shift + alt + l to go to the next window
bind -n M-H previous-window
bind -n M-L next-window

# rebind prefix to Control + a
unbind C-b
set -g prefix C-a
bind C-space send-prefix

# set yank keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Fix colors in tmux
set-option -sa terminal-overrides ",xterm*:Tc"

# let programs inside tmux set the system clipboard (OSC 52)
set -g set-clipboard on

# --- attention alerts (bell-based, e.g. Claude Code waiting for permission) ---
# flag the window in the status bar when any pane rings the bell
set -g monitor-bell on
set -g bell-action any
# keep the audible bell, don't replace it with a status-line message
set -g visual-bell off
# also raise a macOS notification, so bells from panes hidden behind a
# zoomed pane (prefix+z) or in other windows/sessions can't be missed
set-hook -g alert-bell 'run-shell "~/.tmux/tmux-notify.sh \"#{session_name}:#{window_index}\" \"#{session_name}:#{window_index} #{window_name} needs attention\""'

# set -g @catpuccin_flavour 'latte'
# install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'catppuccin/tmux'
set -g @tmux_power_show_host    false

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

# split in cwd directory (new pane in pwd instead of ~)
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

# after tpm so the theme plugin can't override it: make bell-flagged windows stand out
set -g window-status-bell-style 'fg=colour232,bg=colour214,bold'
